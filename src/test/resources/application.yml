spring:
  application:
    name: smart-insurance-platform-test
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 51MB
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true

embabel:
  models:
    default-llm: deepseek-chat
    llms:
      fast: deepseek-chat
      balanced: deepseek-chat
      powerful: deepseek-reasoner
      best: deepseek-reasoner

  agent:
    platform:
      models:
        deepseek:
          api-key: ${DEEPSEEK_API_KEY:sk-test-placeholder-for-integration-tests}
          timeout: 120s
          max-retries: 3
          connect-timeout: 30s
          read-timeout: 120s

insurance:
  rag:
    qdrant:
      host: localhost
      rest-port: 16333   # 测试环境用不存在端口，确保自动降级
    documents-path: classpath:documents/
    documents: comprehensive_vehicle_insurance.md,claims_guide.md,faq.md
    auto-ingest: false
    lucene:
      name: insurance-lucene
      chunk-size: 1000
      chunk-overlap: 200
    embedding:
      enabled: false
      model: text-embedding-3-small
      base-url: https://api.deepseek.com/v1
      api-key: ${DEEPSEEK_API_KEY:}
      dimensions: 1536
      vector-weight: 0.5

server:
  port: 0

xiaoming:
  product:
    product-id: "36743"
    name: "复星联合达尔文12号重大疾病保险（互联网）"
    current-knowledge-version: "v2.0-baseline"
    environment: test
  knowledge:
    max-chunk-characters: 1200
    chunk-overlap-characters: 150
    rrf-k: 60
    evidence-threshold: 0.01
    degraded-vector-threshold: 0.8
  knowledge-import:
    enabled: false
    source-directory:
    spreadsheet-scan-mode: STRUCTURE_ONLY
  conversation:
    model-enabled: false
    top-k: 10
    max-evidence-characters: 6000
    max-answer-characters: 1200
  health:
    max-files: 5
    max-file-bytes: 10485760
    max-pdf-pages: 30
    max-text-characters: 20000
    minimum-confidence: 0.5
    processing-timeout-millis: 30000
  application:
    enabled: true
    base-url: https://apply.example.test/start
    allowed-domains: apply.example.test
    allowed-params: channelType,source
    ttl-seconds: 300
  feedback:
    enabled: true
    max-records: 100

logging:
  level:
    com.embabel.insurance: DEBUG
    com.embabel.agent: DEBUG
    com.embabel: DEBUG
    org.springframework.ai: WARN
