spring:
  application:
    name: smart-insurance-platform
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 51MB
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/embabel_insurance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:Embabel@2024!}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

embabel:
  models:
    default-llm: deepseek-chat
    llms:
      fast: deepseek-chat
      balanced: deepseek-chat
      powerful: deepseek-reasoner
      best: deepseek-reasoner

  agent:
    shell:
      # This project is an H5/API application; do not let the interactive shell block startup runners.
      interactive:
        enabled: false
      web-application-type: servlet
    platform:
      models:
        deepseek:
          api-key: ${DEEPSEEK_API_KEY}
    agent-platform:
      scanning:
        annotation: true
        bean: true
  # ============================================================
  # 可观测性配置（默认关闭，按需开启）
  # 开启方式：将 enabled 改为 true，取消 management 段注释
  # ============================================================
  observability:
    enabled: false   # 在 main() 中手动初始化 OTEL，避免与 MySQL JDBC 9.x 冲突
    service-name: SmartInsurancePlatform

insurance:
  rag:
    documents-path: classpath:documents/
    documents: comprehensive_vehicle_insurance.md,claims_guide.md,faq.md
    # 旧车险演示资料不得进入产品 36743 的运行链路。
    auto-ingest: false
    lucene:
      name: insurance-lucene
      chunk-size: 1000
      chunk-overlap: 200
    qdrant:
      host: ${QDRANT_HOST:localhost}
      rest-port: ${QDRANT_REST_PORT:6333}
      collection-name: insurance_docs
      vector-size: 768
    embedding:
      enabled: true
      model: nomic-embed-text
      base-url: http://localhost:11434/v1
      api-key: ollama
      dimensions: 768
    hybrid:
      rrf-k: 60
server:
  port: 8080

xiaoming:
  product:
    product-id: "36743"
    name: "复星联合达尔文12号重大疾病保险（互联网）"
    current-knowledge-version: "v2.0-baseline"
    environment: ${APP_ENVIRONMENT:local}
  knowledge:
    max-chunk-characters: 1200
    chunk-overlap-characters: 150
    rrf-k: 60
    evidence-threshold: 0.01
    degraded-vector-threshold: 0.8
  knowledge-import:
    # Explicit opt-in only. The source directory contains ignored local UAT materials.
    enabled: ${XIAOMING_KNOWLEDGE_IMPORT_ENABLED:false}
    source-directory: ${XIAOMING_KNOWLEDGE_SOURCE_DIRECTORY:}
    spreadsheet-scan-mode: ${XIAOMING_SPREADSHEET_SCAN_MODE:STRUCTURE_ONLY}
  conversation:
    # Local deterministic fallback stays available when model access is disabled.
    model-enabled: ${XIAOMING_MODEL_ENABLED:false}
    top-k: 6
    max-evidence-characters: 6000
    max-answer-characters: 1200
  health:
    max-files: 5
    max-file-bytes: 10485760
    max-pdf-pages: 30
    max-text-characters: 20000
    minimum-confidence: 0.5
    # Hard stop for each file/OCR task; timed-out work is interrupted and no draft is guessed.
    processing-timeout-millis: 30000
  application:
    # Keep disabled until an approved environment-specific HTTPS address is supplied.
    enabled: ${XIAOMING_APPLICATION_ENABLED:false}
    base-url: ${XIAOMING_APPLICATION_BASE_URL:}
    allowed-domains: ${XIAOMING_APPLICATION_ALLOWED_DOMAINS:}
    allowed-params: channelType,source
    ttl-seconds: 300
  feedback:
    enabled: ${XIAOMING_FEEDBACK_ENABLED:true}
    max-records: 1000

# ============================================================
# 可观测性 — Actuator + Prometheus（已开启）
# Langfuse 按需取消注释并设置 LANGFUSE_* 环境变量
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,metrics
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    com.embabel.insurance: DEBUG
    com.embabel.agent: DEBUG
