spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./.local-data/xiaoming;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

insurance:
  rag:
    auto-ingest: true
    embedding:
      enabled: false

embabel:
  observability:
    enabled: false

logging:
  level:
    com.embabel.insurance: INFO
    com.embabel.agent: INFO
